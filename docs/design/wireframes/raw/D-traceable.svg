<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img" aria-labelledby="wfTitle">
  <title id="wfTitle">WIRE-01 登录页 · 需求编号线框（推荐交付格式）</title>
  <defs>
    <style>
      text{font-family:"Microsoft YaHei","Segoe UI",sans-serif}
      .ink{fill:#2f3a44}.mid{fill:#6b7683}.light{fill:#8e99a4}
      .h1{font-size:38px;font-weight:650;letter-spacing:-.5px}
      .h2{font-size:24px;font-weight:600}
      .body{font-size:16px}.sub{font-size:14px;fill:#6b7683}
      .lbl{font-size:13px;fill:#6b7683}.cap{font-size:11px;fill:#8e99a4}
      .mark{font-size:13px;font-weight:700;fill:#fff}
      .note{font-size:11px;fill:#6b7683}
    </style>
  </defs>

  <rect width="1440" height="900" fill="#f5f7f9"/>
  <rect x="8" y="8" width="1424" height="884" fill="none" stroke="#c9cfd6"/>

  <!-- topbar 82 -->
  <rect x="9" y="9" width="1422" height="82" fill="#fff" stroke="#c9cfd6"/>
  <rect x="56" y="29" width="42" height="42" rx="10" fill="#e3e7eb"/>
  <text x="77" y="57" class="mid" font-size="19" text-anchor="middle">变</text>
  <text x="112" y="49" class="ink" font-size="17" font-weight="600">表单填报系统</text>
  <text x="112" y="68" class="light" font-size="12">设计变更工作台</text>
  <text x="1300" y="56" class="light" font-size="12">未登录 · 不显示账号区</text>

  <!-- container guides -->
  <line x1="195" y1="120" x2="195" y2="700" stroke="#c9cfd6" stroke-dasharray="4 4"/>
  <line x1="1245" y1="120" x2="1245" y2="700" stroke="#c9cfd6" stroke-dasharray="4 4"/>
  <text x="200" y="116" class="cap">内容容器 1050 · 水平居中</text>

  <!-- intro column -->
  <text x="195" y="192" class="light" font-size="12" letter-spacing="2">设计变更管理</text>
  <text x="195" y="252" class="ink h1">每一项变更，</text>
  <text x="195" y="314" class="ink h1">从清晰的记录开始。</text>
  <text x="195" y="362" class="body" fill="#6b7683">填写概述，保存草稿。随时重新打开，</text>
  <text x="195" y="394" class="body" fill="#6b7683">继续上一次的工作。</text>
  <line x1="195" y1="452" x2="545" y2="452" stroke="#c9cfd6"/>
  <text x="195" y="482" class="light" font-size="12">01 填写概述　　02 保存草稿　　03 继续填写</text>

  <!-- login panel -->
  <rect x="635" y="150" width="441" height="356" rx="12" fill="#fff" stroke="#c9cfd6"/>
  <text x="669" y="202" class="ink h2">登录工作台</text>
  <text x="669" y="231" class="sub">使用已有账号登录</text>

  <text x="669" y="275" class="lbl">用户名</text>
  <rect x="669" y="285" width="373" height="42" rx="8" fill="#eef1f4" stroke="#c9cfd6"/>
  <text x="683" y="312" class="light" font-size="14">请输入用户名</text>

  <text x="669" y="357" class="lbl">密码</text>
  <rect x="669" y="367" width="373" height="42" rx="8" fill="#eef1f4" stroke="#c9cfd6"/>
  <text x="683" y="394" class="light" font-size="14">请输入密码</text>
  <rect x="989" y="380" width="18" height="14" rx="2" fill="none" stroke="#8e99a4"/>

  <rect x="669" y="435" width="373" height="44" rx="8" fill="#e3e7eb" stroke="#7e8994"/>
  <text x="855" y="463" class="ink" font-size="15" font-weight="600" text-anchor="middle">登 录</text>

  <!-- size callouts -->
  <line x1="635" y1="516" x2="572" y2="516" stroke="#8e99a4" stroke-dasharray="3 3"/>
  <text x="470" y="520" class="cap">栏间距 80</text>
  <text x="1280" y="516" class="cap" text-anchor="end">登录面板 441 宽 · 内边距 34 · 圆角 12</text>

  <!-- numbered callouts (left of the panel, no text overlap) -->
  <g>
    <circle cx="600" cy="50" r="12" fill="#2f3a44"/><text x="600" y="55" text-anchor="middle" class="mark">1</text>
    <circle cx="600" cy="200" r="12" fill="#2f3a44"/><text x="600" y="205" text-anchor="middle" class="mark">2</text>
    <circle cx="600" cy="306" r="12" fill="#2f3a44"/><text x="600" y="311" text-anchor="middle" class="mark">3</text>
    <circle cx="600" cy="388" r="12" fill="#2f3a44"/><text x="600" y="393" text-anchor="middle" class="mark">4</text>
    <circle cx="600" cy="457" r="12" fill="#2f3a44"/><text x="600" y="462" text-anchor="middle" class="mark">5</text>
    <circle cx="600" cy="642" r="12" fill="#2f3a44" opacity="0"/><text x="600" y="647" text-anchor="middle" class="mark" opacity="0">6</text>
  </g>
  <g stroke="#8e99a4" stroke-dasharray="3 3" fill="none">
    <line x1="612" y1="50" x2="1280" y2="50"/>
    <line x1="612" y1="200" x2="635" y2="200"/>
    <line x1="612" y1="306" x2="669" y2="306"/>
    <line x1="612" y1="388" x2="669" y2="388"/>
    <line x1="612" y1="457" x2="669" y2="457"/>
  </g>

  <!-- legend -->
  <rect x="195" y="556" width="1050" height="196" rx="10" fill="#fff" stroke="#c9cfd6"/>
  <text x="219" y="584" class="ink" font-size="14" font-weight="600">标注说明 · 每条对应一个可验收的需求点</text>
  <g class="note">
    <circle cx="230" cy="608" r="10" fill="#2f3a44"/><text x="230" y="612" text-anchor="middle" class="mark" font-size="11">1</text>
    <text x="250" y="612">顶栏：品牌标识 ＋ 系统名 ＋ 副标题。未登录时不显示账号区与退出入口。</text>
    <circle cx="230" cy="636" r="10" fill="#2f3a44"/><text x="230" y="640" text-anchor="middle" class="mark" font-size="11">2</text>
    <text x="250" y="640">登录卡片：标题「登录工作台」＋ 说明文字；登录失败时在说明下显示错误提示。</text>
    <circle cx="230" cy="664" r="10" fill="#2f3a44"/><text x="230" y="668" text-anchor="middle" class="mark" font-size="11">3</text>
    <text x="250" y="668">用户名：必填。空值提交时提示「请输入用户名」，登录中表单整体禁用。</text>
    <circle cx="230" cy="692" r="10" fill="#2f3a44"/><text x="230" y="696" text-anchor="middle" class="mark" font-size="11">4</text>
    <text x="250" y="696">密码：必填，可切换显示/隐藏；请求期间显示 loading 并禁止重复提交。</text>
    <circle cx="230" cy="720" r="10" fill="#2f3a44"/><text x="230" y="724" text-anchor="middle" class="mark" font-size="11">5</text>
    <text x="250" y="724">登录按钮：全宽主按钮。成功后关闭密码显示态并进入工作台首页。</text>
  </g>
  <circle cx="230" cy="744" r="10" fill="#e3e7eb" stroke="#8e99a4"/>
  <text x="250" y="748">说明区（本页不出现）：重新登录弹窗复用同一表单的紧凑形态，不含左侧介绍区。</text>

  <text x="196" y="784" class="cap">视图 1440 × 900 · 尺寸取自 frontend/src/App.css 与 App.tsx 实测值 · 灰度线框不含品牌色</text>
</svg>
