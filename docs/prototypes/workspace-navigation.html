<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>统一账号工作台 · A/B 导航预览</title>
<style>
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#243731;background:#f3f6f4;--green:#176b5b;--muted:#62766d;--line:#dce5df}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}button,a,input,textarea,select{outline-offset:4px}a{color:var(--green)}h1,h2,p{margin-top:0}h1{font-size:30px;margin-bottom:10px}h2{font-size:18px}p{line-height:1.7}.muted{color:var(--muted)}.small{font-size:13px}.eyebrow{color:var(--green);font-size:12px;font-weight:600;letter-spacing:2px;margin-bottom:9px}
.demo-bar{padding:13px 32px;background:#fff8e9;border-bottom:1px solid #eadcc0;display:flex;align-items:center;justify-content:space-between;gap:16px;color:#72551d;font-size:13px}.demo-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.demo-controls a{padding:6px 12px;border-radius:6px;text-decoration:none;color:#72551d;border:1px solid #dbcba8}.demo-controls a.active{background:#72551d;color:white}.demo-controls select{padding:6px 9px;border:1px solid #dbcba8;border-radius:6px;background:white}.topbar{height:82px;padding:0 40px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:12px;align-items:center}.brand-mark{height:40px;width:40px;display:grid;place-items:center;background:var(--green);border-radius:10px;color:white;font-size:22px}.brand strong{display:block;font-size:17px}.brand small{display:block;margin-top:5px;color:var(--muted)}.user-menu{display:flex;align-items:center;gap:14px}.avatar{display:grid;place-items:center;background:#e4efe9;color:var(--green);border-radius:50%;width:34px;height:34px}.button{border:1px solid #cedbd3;border-radius:7px;padding:9px 15px;background:white;color:#304c3f;white-space:nowrap}.button:hover{border-color:var(--green);background:#f4f9f6}.button.primary{background:var(--green);border-color:var(--green);color:white}.button.quiet{border-color:transparent;background:transparent}.tag{font-size:12px;padding:4px 9px;border-radius:5px;display:inline-block;white-space:nowrap;background:#edf1ee;color:#56675e}.tag.pending{background:#fff4d7;color:#866423}.tag.returned{background:#fff0e1;color:#a5682a}.tag.approved{background:#e6f4eb;color:#2b7a50}
main{max-width:1220px;margin:auto;padding:30px 36px 72px}.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:30px}.tab{border:0;border-bottom:3px solid transparent;background:transparent;padding:0 1px 16px;color:var(--muted);font-weight:600;font-size:15px}.tab.active{border-color:var(--green);color:var(--green)}.count{font-size:12px;border-radius:12px;padding:2px 7px;background:#e7eee9;margin-left:8px}.page-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}.page-heading p{margin-bottom:0}.panel{background:white;border:1px solid var(--line);border-radius:10px;overflow:hidden}.panel-heading{padding:19px 22px;border-bottom:1px solid #e7ede8;display:flex;align-items:center;justify-content:space-between}.panel-heading h2{margin:0}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left;min-width:760px}th{background:#fafcfb;color:#62766d;font-size:13px;font-weight:500}th,td{padding:18px 22px;border-bottom:1px solid #edf1ee;font-size:14px}tbody tr:last-child td{border-bottom:0}.record-title{font-weight:600;display:block;margin-bottom:6px}.record-title+p{font-size:12px;margin:0;color:var(--muted)}.number{font-family:Consolas,monospace;font-size:13px}.row-button{border:0;background:transparent;color:var(--green);font-size:14px;padding:6px 0}.note{font-size:13px;color:var(--muted);margin:18px 0 0}.breadcrumbs{display:flex;align-items:center;gap:8px;margin-bottom:22px;font-size:13px;color:var(--muted)}.breadcrumbs button{border:0;background:none;padding:0;color:var(--green)}
.welcome{padding-top:12px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:32px}.entry-card{padding:30px;text-align:left;background:white;border:1px solid var(--line);border-radius:12px;color:inherit;min-height:248px;transition:transform .15s,border-color .15s}.entry-card:hover{transform:translateY(-3px);border-color:var(--green)}.card-icon{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;background:#e8f2ec;color:var(--green);font-size:22px;margin-bottom:22px}.entry-card h2{font-size:21px;margin-bottom:10px}.entry-card p{margin-bottom:22px;color:var(--muted);font-size:14px}.card-bottom{display:flex;justify-content:space-between;align-items:center;color:var(--green);font-size:14px;font-weight:600}.card-count{font-weight:400;color:var(--muted);font-size:13px}.home-footer{margin-top:26px;padding:17px 20px;border-radius:8px;background:#eaf0ec;color:#587165;font-size:13px}.section-tabs{display:flex;gap:10px;margin-bottom:20px}.chip{padding:7px 14px;border:1px solid var(--line);background:white;border-radius:6px;font-size:13px;color:var(--muted)}.chip.active{background:#e6f1ea;color:var(--green);border-color:#bed7c8}
.detail-layout{display:grid;grid-template-columns:minmax(0,1fr) 255px;gap:22px}.form-body{padding:24px}.form-body label{display:block;margin-bottom:9px;font-size:14px;font-weight:600}.form-body input,.form-body textarea{width:100%;border:1px solid #cad8cf;border-radius:6px;padding:10px 12px;margin-bottom:22px;color:#243731;background:white}.form-body input:read-only,.form-body textarea:read-only{background:#f7f9f7;color:#62766d}.form-body textarea{min-height:120px;resize:vertical}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:20px}.form-actions{display:flex;align-items:center;gap:12px}.form-nav{display:flex;gap:8px;flex-wrap:wrap;padding:16px 22px;border-bottom:1px solid var(--line);font-size:13px}.form-nav span{color:#77887e;padding:7px 9px;border-radius:5px}.form-nav span.selected{color:var(--green);background:#e6f1ea}.side-panel{padding:22px;height:fit-content}.side-panel dl{font-size:13px;margin:0}.side-panel dt{color:var(--muted);margin-top:18px;margin-bottom:6px}.side-panel dd{margin:0;line-height:1.6}.notice{padding:12px 16px;border:1px solid #d1e3d7;background:#f1f8f3;border-radius:7px;font-size:13px;color:#44634f;margin-bottom:20px}.footer{margin-top:28px;border-top:1px solid var(--line);padding-top:18px;font-size:12px;color:#7b8c82}.feedback{position:fixed;bottom:26px;right:26px;border:1px solid #d8e2dc;border-radius:50%;height:64px;width:64px;background:white;color:#304c3f;box-shadow:0 4px 18px #24373120;font-size:12px;line-height:19px}.toast{position:fixed;top:142px;left:50%;transform:translateX(-50%);background:#243731;color:white;padding:12px 22px;border-radius:8px;font-size:14px;z-index:10}.toast[hidden]{display:none}dialog{border:1px solid var(--line);border-radius:12px;padding:28px;max-width:520px;width:calc(100% - 40px);box-shadow:0 16px 70px #24373135}dialog::backdrop{background:#24373155}dialog textarea{width:100%;min-height:100px;border:1px solid #cad8cf;border-radius:6px;padding:12px;margin:6px 0 22px}dialog .dialog-actions{display:flex;justify-content:flex-end;gap:10px}
@media(max-width:800px){.demo-bar{align-items:flex-start;flex-direction:column;padding:12px 18px}.topbar{padding:15px 18px;height:auto;gap:15px;flex-wrap:wrap}main{padding:24px 18px 86px}.cards{grid-template-columns:1fr}.detail-layout{grid-template-columns:1fr}.page-heading{align-items:flex-start}h1{font-size:25px}.user-menu{gap:8px}.brand small{font-size:11px}.entry-card{min-height:215px}.form-row{grid-template-columns:1fr}.side-panel{display:none}.feedback{bottom:16px;right:16px}.section-tabs{overflow:auto}}
</style>
</head>
<body>
<div class="demo-bar"><span><strong>导航原型 · 演示</strong>　虚拟账号与数据，仅比较入口方式</span><div class="demo-controls"><a href="?variant=A&amp;account=reviewer" data-variant="A">A · 页签切换</a><a href="?variant=B&amp;account=reviewer" data-variant="B">B · 首页入口</a><label for="account">演示账号</label><select id="account"><option value="reviewer">林晓 · 原审核员</option><option value="ordinary">陈宇 · 普通账号</option></select></div></div>
<header class="topbar"><div class="brand"><span class="brand-mark">变</span><div><strong>表单填报系统</strong><small>设计变更工作台</small></div></div><div class="user-menu"><span class="avatar" id="avatar">林</span><span id="display-name">林晓</span><button class="button quiet" data-action="account-info">账号说明</button></div></header>
<main id="main"></main><button class="feedback" data-action="feedback">意见与<br>反馈</button><div class="toast" id="toast" role="status" hidden></div>
<dialog id="dialog" aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><div id="dialog-body"></div><div class="dialog-actions"><button class="button" id="dialog-close">关闭</button><button class="button primary" id="dialog-send" hidden>模拟发送</button></div></dialog>
<script>
const params=new URLSearchParams(location.search);
let variant=params.get('variant')==='B'?'B':'A',account=params.get('account')==='ordinary'?'ordinary':'reviewer';
let section=variant==='B'?'home':'mine',detailId=null,reviewKind='designated',dirty=false,toastTimer;
const users={reviewer:{name:'林晓',canReview:true},ordinary:{name:'陈宇',canReview:false}};
const initialMine=[
{id:18,title:'传感器外壳材料变更',number:'ECR-26101201',status:'draft',time:'2026-10-12 09:42',reason:'调整外壳材料，评估对产品可靠性和供应的影响。'},
{id:16,title:'控制板元件替代',number:'ECR-26100903',status:'returned',time:'2026-10-12 08:50',reason:'现有元件供货周期延长，申请评估替代器件。'},
{id:12,title:'包装标签信息更新',number:'ECR-26100802',status:'pending',time:'2026-10-09 15:20',reason:'根据产品信息更新包装标签内容。'}];
const mines={reviewer:structuredClone(initialMine),ordinary:structuredClone(initialMine)};
const tasks=[
{id:23,title:'电源模块供应商变更',number:'ECR-26101202',status:'pending',time:'2026-10-12 09:10',applicant:'周宁',kind:'designated',reason:'原供应商交期变化，评估新供应商及相关验证安排。'},
{id:21,title:'测试工装升级',number:'ECR-26101001',status:'pending',time:'2026-10-10 14:30',applicant:'许然',kind:'designated',reason:'升级生产测试工装，核对测试覆盖与使用安排。'},
{id:19,title:'连接器型号调整',number:'ECR-26100904',status:'pending',time:'2026-10-09 16:40',applicant:'周宁',kind:'public',reason:'评估连接器型号调整对生产及维护的影响。'}];
const statusText={draft:'草稿',returned:'待修订',pending:'待审核',approved:'已批准'};
const esc=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const badge=status=>`<span class="tag ${status}">${statusText[status]}</span>`;
const btn=(text,action,primary=false)=>`<button class="button ${primary?'primary':''}" data-action="${action}">${text}</button>`;
function notify(text){const toast=document.getElementById('toast');toast.textContent=text;toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.hidden=true,2800);}
function allowLeave(){return !dirty||confirm('这是演示页面。离开将放弃尚未保存的修改，是否继续？');}
function navigate(next){if(!allowLeave())return;section=next;detailId=null;dirty=false;render();}
function setUrl(){history.replaceState(null,'',`${location.pathname}?${new URLSearchParams({variant,account})}`);}
function showDialog(title,body,send=false){document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-body').innerHTML=body;document.getElementById('dialog-send').hidden=!send;document.getElementById('dialog').showModal();}
function tabs(){return `<nav class="tabs" aria-label="工作台导航"><button class="tab ${section==='mine'?'active':''}" data-action="mine">我的申请<span class="count">${mines[account].length}</span></button>${users[account].canReview?`<button class="tab ${section==='review'?'active':''}" data-action="review">待我处理<span class="count">${tasks.filter(t=>!t.handled).length}</span></button>`:''}</nav>`;}
function home(){return `<section class="welcome"><div class="eyebrow">工作台</div><h1>${users[account].name}，欢迎回来</h1><p class="muted">在这里发起自己的变更申请${users[account].canReview?'，也可以处理交给你的审核事项。':'。'}</p><div class="cards"><button class="entry-card" data-action="mine"><span class="card-icon" aria-hidden="true">＋</span><h2>我的申请</h2><p>新建申请、继续填写，或查看本人申请的进度。</p><div class="card-bottom"><span>进入我的申请　→</span><span class="card-count">${mines[account].length} 份申请</span></div></button>${users[account].canReview?`<button class="entry-card" data-action="review"><span class="card-icon" aria-hidden="true">✓</span><h2>待我处理</h2><p>查看有权处理的他人申请，记录审核意见与决定。</p><div class="card-bottom"><span>进入待我处理　→</span><span class="card-count">${tasks.filter(t=>!t.handled).length} 项待处理</span></div></button>`:''}</div><div class="home-footer">${users[account].canReview?'同一个账号，可以发起申请，也可以处理有权访问的他人申请。':'本步骤普通账号可发起本人申请；处理他人申请的授权将在第二步调整。'}</div></section>`;}
function mineList(){return `<div class="page-heading"><div><div class="eyebrow">工作台</div><h1>我的申请</h1><p class="muted">创建和填写自己的申请，查看提交后的进度。</p></div>${btn('＋ 新建申请','create',true)}</div><section class="panel"><div class="panel-heading"><h2>申请列表</h2><span class="muted small">共 ${mines[account].length} 份</span></div><div class="table-wrap"><table><thead><tr><th>申请</th><th>ECR 编号</th><th>状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody>${mines[account].map(row=>`<tr><td><span class="record-title">${esc(row.title||'未命名申请')}</span><p>申请 #${row.id} · 我发起</p></td><td class="number">${esc(row.number||'未填写')}</td><td>${badge(row.status)}</td><td>${row.time}</td><td><button class="row-button" data-action="open" data-id="${row.id}">${row.status==='draft'?'继续填写':row.status==='returned'?'继续修订':'查看申请'}</button></td></tr>`).join('')}</tbody></table></div></section><p class="note">这里仅展示本人申请。具有审核权限的账号同样可以新建和填写。</p>`;}
function reviewList(){const rows=tasks.filter(row=>reviewKind==='handled'?row.handled:!row.handled&&row.kind===reviewKind);return `<div class="page-heading"><div><div class="eyebrow">工作台</div><h1>待我处理</h1><p class="muted">查看有权处理的他人申请。本人发起的申请不会出现在这里。</p></div><span class="tag pending">${tasks.filter(t=>!t.handled).length} 项待处理</span></div><div class="section-tabs" aria-label="审核事项分类">${[['designated','指定审核'],['public','公开审核'],['handled','已处理记录']].map(([key,label])=>`<button class="chip ${reviewKind===key?'active':''}" data-action="filter" data-kind="${key}">${label}</button>`).join('')}</div><section class="panel"><div class="panel-heading"><h2>${reviewKind==='handled'?'已处理记录':'审核申请'}</h2><span class="muted small">共 ${rows.length} 份</span></div><div class="table-wrap"><table><thead><tr><th>申请</th><th>发起人</th><th>ECR 编号</th><th>审核进度</th><th>操作</th></tr></thead><tbody>${rows.length?rows.map(row=>`<tr><td><span class="record-title">${row.title}</span><p>申请 #${row.id}</p></td><td>${row.applicant}</td><td class="number">${row.number}</td><td><span class="tag ${row.handled?'approved':'pending'}">${row.handled?'本人已同意':'待本人处理'}</span></td><td><button class="row-button" data-action="open" data-id="${row.id}">查看申请</button></td></tr>`).join(''):'<tr><td colspan="5" class="muted" style="text-align:center;padding:45px">暂无记录</td></tr>'}</tbody></table></div></section><p class="note">第一步仍保留现有审核授权与整单审核方式。本页不演示未来逐项任务分配。</p>`;}
function detail(){const own=section==='mine',row=own?mines[account].find(r=>r.id===detailId):tasks.find(r=>r.id===detailId),editable=own&&['draft','returned'].includes(row.status);return `<div class="page-heading"><div><div class="eyebrow">${own?'我的申请':'待我处理'} / 申请 #${row.id}</div><h1>${esc(row.title||'新建申请')}</h1><p class="muted">${own?'本人发起的申请':'由 '+row.applicant+' 发起 · 表单只读'}</p></div>${btn(own?'返回我的申请':'返回待我处理','back')}</div><div class="notice">${editable?'可以填写本人的申请。这是简化的导航演示，保存仅在当前页面内有效。':own?'提交后的申请保持只读。本页仅演示查看和返回。':'本页仅演示现有整单审核入口；他人表单不能修改，操作只影响虚拟记录。'}</div><div class="detail-layout"><section class="panel"><div class="form-nav"><span class="selected">概述</span><span>物料与处置</span><span>问题评估</span><span>ECR</span><span>ECO</span><span>…</span></div><div class="form-body"><label for="title">申请标题</label><input id="title" value="${esc(row.title)}" ${editable?'':'readonly'}><div class="form-row"><div><label for="number">ECR 编号</label><input id="number" value="${esc(row.number)}" ${editable?'':'readonly'}></div><div><label for="applicant">发起人</label><input id="applicant" value="${own?users[account].name:row.applicant}" readonly></div></div><label for="reason">变更原因</label><textarea id="reason" ${editable?'':'readonly'}>${esc(row.reason)}</textarea><div class="form-actions">${editable?btn('保存演示草稿','save',true):own?'':btn('查看审核意见','issues')+btn(row.handled?'本人已同意':'模拟本人同意批准','approve',true)}<span class="muted small" id="save-state">${editable?'未修改':own?'申请只读':'审核中 · 非真实业务'}</span></div></div></section><aside class="panel side-panel"><h2>申请信息</h2>${badge(row.status)}<dl><dt>当前账号</dt><dd>${users[account].name}</dd><dt>本次职责</dt><dd>${own?'申请发起人':'有权审核本单'}</dd><dt>操作范围</dt><dd>${editable?'填写自己的申请':own?'查看自己的申请':'查看表单、记录审核意见'}</dd></dl></aside></div>`;}
function render(){if(section==='review'&&!users[account].canReview)section=variant==='B'?'home':'mine';document.body.dataset.variant=variant;document.body.dataset.section=section;document.body.dataset.account=account;document.getElementById('account').value=account;document.getElementById('display-name').textContent=users[account].name;document.getElementById('avatar').textContent=users[account].name[0];document.querySelectorAll('[data-variant]').forEach(link=>{link.classList.toggle('active',link.dataset.variant===variant);link.href=`?variant=${link.dataset.variant}&account=${account}`;});const nav=variant==='A'?tabs():section==='home'?'':`<nav class="breadcrumbs" aria-label="当前位置"><button data-action="home">工作台首页</button><span>/</span><span>${section==='mine'?'我的申请':'待我处理'}</span></nav>`;document.getElementById('main').innerHTML=nav+(detailId!==null?detail():section==='home'?home():section==='mine'?mineList():reviewList())+`<footer class="footer">${variant==='A'?'A版 · 顶部页签，两个列表直接切换':'B版 · 首页入口，先选择要做的事情'}　／　仅比较导航，不连接业务接口；刷新页面恢复示例数据。</footer>`;if(detailId!==null&&section==='review'){const approve=document.querySelector('[data-action="approve"]');if(approve&&tasks.find(r=>r.id===detailId).handled)approve.disabled=true;}}
document.addEventListener('click',event=>{const target=event.target.closest('button[data-action],a[data-variant]');if(!target)return;if(target.dataset.variant){event.preventDefault();if(!allowLeave())return;variant=target.dataset.variant;section=variant==='B'?'home':'mine';detailId=null;dirty=false;setUrl();render();return;}const action=target.dataset.action;
if(['home','mine','review'].includes(action)){navigate(action);return;}
if(action==='back'){navigate(section);return;}
if(action==='open'){detailId=Number(target.dataset.id);dirty=false;render();return;}
if(action==='filter'){reviewKind=target.dataset.kind;render();return;}
if(action==='create'){const next={id:Math.max(...mines[account].map(r=>r.id))+1,title:'',number:'',status:'draft',time:'2026-10-12 10:00',reason:''};mines[account].unshift(next);detailId=next.id;render();notify('已创建虚拟草稿，可以填写并保存');return;}
if(action==='save'){const row=mines[account].find(r=>r.id===detailId);row.title=document.getElementById('title').value;row.number=document.getElementById('number').value;row.reason=document.getElementById('reason').value;dirty=false;render();document.getElementById('save-state').textContent='已保存在本次演示中';notify('演示草稿已保存，未写入数据库');return;}
if(action==='approve'){tasks.find(r=>r.id===detailId).handled=true;render();notify('模拟：已记录个人同意，整单仍待审核');return;}
if(action==='issues'){showDialog('审核意见 · 演示','<p class="muted">暂无已提交的修改意见。</p><p>正式重构将复用现有意见与退回流程；本原型只展示入口，不改变审核规则。</p>');return;}
if(action==='account-info'){showDialog('同一个账号，两类操作',`<p>当前演示账号：<strong>${users[account].name}</strong></p><p>${users[account].canReview?'可创建、填写本人申请，也可处理有权访问的他人申请。':'可创建、填写本人申请。本步骤尚未开放普通账号处理他人申请。'}</p><p class="muted small">顶部账号切换仅用于比较原型，不代表正式系统需要切换账号。</p>`);return;}
if(action==='feedback'){showDialog('意见与反馈 · 演示','<p class="muted">两版共用此入口。可填写对导航方式的意见，文字只用于本次演示。</p><label for="feedback-text">你的意见</label><textarea id="feedback-text" placeholder="例如：我更习惯直接切换两个列表…"></textarea>',true);}
});
document.addEventListener('input',event=>{if(['title','number','reason'].includes(event.target.id)){dirty=true;document.getElementById('save-state').textContent='有未保存的修改';}});
document.getElementById('account').addEventListener('change',event=>{const next=event.target.value;if(!allowLeave()){event.target.value=account;return;}account=next;section=variant==='B'?'home':'mine';detailId=null;dirty=false;setUrl();render();});
document.getElementById('dialog-close').addEventListener('click',()=>document.getElementById('dialog').close());
document.getElementById('dialog-send').addEventListener('click',()=>{document.getElementById('dialog').close();notify('已模拟发送，本次演示不会提交真实反馈');});
window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue='';}});
setUrl();render();
</script>
</body>
</html>
